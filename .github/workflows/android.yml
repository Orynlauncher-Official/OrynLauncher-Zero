name: OrynLauncher Android CI

on:
  pull_request:
    branches-ignore:
      - 'l10n_v3_openjdk2'
    types: [ opened, reopened ]
  push:
    branches-ignore:
      - 'l10n_v3_openjdk2'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      GPLAY_KEYSTORE_PASSWORD: ${{ secrets.GPLAY_KEYSTORE_PASSWORD }}
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        run: |
          cd app_orynlauncher/libs
          curl -fL --retry 3 https://github.com/PojavLauncherTeam/LTW/releases/latest/download/ltw-release.aar -o ltw-release.aar

      - name: Get JRE 8
        run: |
          mkdir -p app_orynlauncher/src/main/assets/components/jre
          curl -fL --retry 3 https://github.com/MojoLauncher/android-openjdk-build-multiarch/releases/download/rolling/jre8-pojav.zip -o /tmp/jre8-pojav.zip
          unzip -oq /tmp/jre8-pojav.zip -d app_orynlauncher/src/main/assets/components/jre

      - name: Get JRE17
        run: |
          mkdir -p app_orynlauncher/src/main/assets/components/jre-new
          curl -fL --retry 3 https://github.com/MojoLauncher/android-openjdk-build-17-25/releases/download/rolling/jre17-pojav.zip -o /tmp/jre17-pojav.zip
          unzip -oq /tmp/jre17-pojav.zip -d app_orynlauncher/src/main/assets/components/jre-new

      - name: Get JRE21
        run: |
          mkdir -p app_orynlauncher/src/main/assets/components/jre-21
          curl -fL --retry 3 https://github.com/MojoLauncher/android-openjdk-build-17-25/releases/download/rolling/jre21-pojav.zip -o /tmp/jre21-pojav.zip
          unzip -oq /tmp/jre21-pojav.zip -d app_orynlauncher/src/main/assets/components/jre-21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"

      - name: Build JRE JAR files
        run: |
          ./scripts/languagelist_updater.sh

          mkdir out
          # Build JRE JAR files (security manager, etc...)
          gradle :jre_lwjgl3glfw:build --no-daemon

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Google Play .aab
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        run: |
          gradle :app_orynlauncher:bundleGplay
          mv app_orynlauncher/build/outputs/bundle/gplay/app_orynlauncher-gplay.aab out/app-gplay.aab

      - name: Build Debug .apk
        run: |
          # Build the launcher
          gradle :app_orynlauncher:assembleDebug
          mv app_orynlauncher/build/outputs/apk/debug/app_orynlauncher-debug.apk out/OrynLauncher-debug.apk

      - name: Build APK without runtime
        run: |
          rm -r app_orynlauncher/src/main/assets/components/jre
          rm -r app_orynlauncher/src/main/assets/components/jre-new
          rm -r app_orynlauncher/src/main/assets/components/jre-21
          gradle assembleDebug
          mv app_orynlauncher/build/outputs/apk/debug/app_orynlauncher-debug.apk out/OrynLauncher-debug-no-runtime.apk
      - name: Gen md5sums
        run: |
          md5sum out/OrynLauncher-debug.apk > out/OrynLauncher-debug.md5
          md5sum out/OrynLauncher-debug-no-runtime.apk > out/OrynLauncher-debug-no-runtime.md5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrynLauncher-debug
          path: out/OrynLauncher-debug.*

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: out/app-gplay.aab

      - name: Upload onto the Google Play testing track
        continue-on-error: true
        if: github.repository_owner == 'PojavLauncherTeam' && github.ref_name == 'v3_openjdk'
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_JSON }}
          packageName: net.kdt.pojavlaunch
          releaseFiles: out/app-gplay.aab
          track: internal
          inAppUpdatePriority: 5

      - name: Upload APK (without runtime)
        uses: actions/upload-artifact@v4
        with:
          name: OrynLauncher-debug-no-runtime
          path: out/OrynLauncher-debug-no-runtime.*

